services:
  # Frontend React (Vite) Static Site - Demo Mode
  - type: web
    name: agriflow-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_MODE
        value: demo
